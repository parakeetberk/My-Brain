<title>The Open Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found]){display:none!important}

:root{
  --green:#4ABA81; --yellow:#FFCC3B; --red:#F16262;
  --ground:#FFFFFF; --panel:#F5F7F8; --panel2:#EDF2F4; --rule:#DCE4E8; --muted:#8FA3B2;
  --ink:#2F4E65; --ink-dim:#5B7686;
  --disp:"Red Hat Display",Calibri,Arial,sans-serif;
  --body:"Red Hat Text","Red Hat Display",Calibri,Arial,sans-serif;
  --mono:"Red Hat Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#1B2E3C; --panel:#243D4E; --panel2:#2C4859; --rule:#365468;
  --ink:#EAF1F4; --ink-dim:#AFC3CE; --muted:#8FA3B2;}}
:root[data-theme="dark"]{
  --ground:#1B2E3C; --panel:#243D4E; --panel2:#2C4859; --rule:#365468;
  --ink:#EAF1F4; --ink-dim:#AFC3CE; --muted:#8FA3B2;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:36px 24px 90px}
h1,h2,h3{font-family:var(--disp);color:var(--ink);margin:0;text-wrap:balance}
h1{font-weight:900;font-size:34px;line-height:1.12;letter-spacing:-.02em}
.eyebrow{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.lede{font-size:16px;color:var(--ink-dim);max-width:78ch;margin:16px 0 0}
.lede b{color:var(--ink)}

/* headline three */
.hi{margin:30px 0 0;border-left:3px solid var(--red);background:var(--panel);
  padding:16px 20px 18px;border-radius:0 3px 3px 0}
.hi h2{font-weight:700;font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px}
.hi ol{margin:0;padding-left:20px}
.hi li{margin-bottom:6px;font-size:14px;color:var(--ink-dim)}
.hi li b{color:var(--ink);font-weight:700}
.hi li:last-child{margin-bottom:0}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:26px 0 0}
.stat{background:var(--panel);padding:13px 14px 15px}
.stat b{display:block;font-family:var(--disp);font-weight:900;font-size:26px;line-height:1;
  font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.35}

/* filter bar */
.bar{position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);padding:14px 0 13px;margin:28px 0 0}
.bar__row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
input[type=search],select{font-family:var(--body);font-size:13px;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:7px 10px}
input[type=search]{flex:1 1 210px;min-width:170px}
select{max-width:220px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-dim);
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:6px 11px;cursor:pointer}
.tog input{accent-color:var(--red);margin:0}
.btn{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--ink);
  background:transparent;border:1px solid var(--rule);border-radius:4px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--panel)}
.count{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--muted);
  margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--ink)}

/* sections */
details.reg{border:1px solid var(--rule);border-radius:4px;margin-top:14px;background:var(--ground)}
details.reg>summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;
  align-items:baseline;gap:11px;background:var(--panel);border-radius:3px}
details.reg[open]>summary{border-bottom:1px solid var(--rule);border-radius:3px 3px 0 0}
summary::-webkit-details-marker{display:none}
.caret{font-family:var(--mono);font-size:11px;color:var(--muted);width:9px;flex:none}
details[open]>summary .caret::after{content:"▾"}
details:not([open])>summary .caret::after{content:"▸"}
.rtitle{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink)}
.rsub{font-size:12px;color:var(--muted)}
.rn{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:13px;
  color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

details.sub{border-top:1px solid var(--rule)}
details.sub>summary{cursor:pointer;list-style:none;padding:9px 16px 9px 30px;display:flex;
  align-items:baseline;gap:9px;background:var(--ground)}
details.sub>summary:hover{background:var(--panel)}
.stitle{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--ink-dim)}

/* rows */
.row-legacy{display:none}
.row:hover{background:var(--panel)}
.desc{color:var(--ink);font-size:13.5px}
.meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.own{font-size:12px;color:var(--ink-dim);word-break:break-word}
.own.un{color:var(--red);font-weight:700}
.age{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;
  font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-family:var(--disp);font-weight:700;font-size:9.5px;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:3px;
  white-space:nowrap;line-height:1.25}
.p-crit{background:var(--red);color:#3D1010}
.p-rule{background:var(--yellow);color:#3D2E00}
.p-high{background:var(--yellow);color:#3D2E00}
.p-blok{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.p-dna{background:var(--green);color:#0C2A1C}
.p-open{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.p-clos{background:transparent;color:var(--muted);border:1px dashed var(--rule)}
[hidden]{display:none!important}
.empty{padding:26px 16px;color:var(--muted);font-size:13.5px}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--muted);max-width:92ch}
footer b{color:var(--ink-dim)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr;gap:3px;padding-left:20px}
  .age{text-align:left}
  h1{font-size:26px}
  .wrap{padding:26px 16px 70px}
}

.row{display:grid;grid-template-columns:78px 96px 1fr 132px 108px;gap:11px;
  padding:9px 16px 9px 26px;border-top:1px solid var(--rule);align-items:start}
.rid{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-dim);
  cursor:pointer;border:1px solid var(--rule);border-radius:3px;padding:2px 5px;
  background:var(--panel);white-space:nowrap;user-select:all}
.rid:hover{border-color:var(--green);color:var(--ink)}
.rid.copied{background:var(--green);color:#0C2A1C;border-color:var(--green)}
.srcs{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.slink{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.04em;
  text-transform:uppercase;padding:3px 7px;border-radius:3px;text-decoration:none;
  background:var(--green);color:#0C2A1C;white-space:nowrap}
.slink:hover{filter:brightness(1.08)}
.stype{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.sreg{font-size:10.5px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--rule)}
.sreg:hover{color:var(--ink)}
.cpq{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.04em;
  text-transform:uppercase;padding:3px 7px;border-radius:3px;cursor:pointer;
  background:transparent;color:var(--ink-dim);border:1px solid var(--rule);white-space:nowrap}
.cpq:hover{border-color:var(--ink-dim);color:var(--ink)}
.cpq.copied{background:var(--green);color:#0C2A1C;border-color:var(--green)}
.how{margin:22px 0 0;border-left:3px solid var(--green);background:var(--panel);
  padding:15px 20px 17px;border-radius:0 3px 3px 0}
.how h2{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.how p{margin:0 0 7px;font-size:13.5px;color:var(--ink-dim)}
.how p:last-child{margin-bottom:0}
.how code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:3px;color:var(--ink)}
@media (max-width:900px){.row{grid-template-columns:1fr;gap:4px;padding-left:20px}
  .age{text-align:left}.srcs{flex-direction:row;flex-wrap:wrap;align-items:center}}

/* ---- comments ---- */
.cbtn{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.04em;
  text-transform:uppercase;padding:3px 7px;border-radius:3px;cursor:pointer;
  background:transparent;color:var(--ink-dim);border:1px solid var(--rule);white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
.cbtn:hover{border-color:var(--ink-dim);color:var(--ink)}
.cbtn.has{border-color:var(--ink-dim);color:var(--ink);background:var(--panel)}
.cbtn.pend{border-color:var(--yellow);background:var(--yellow);color:#3D2E00}
.cbtn i{font-style:normal;font-family:var(--mono);font-size:10px;opacity:.75}
.wrap{max-width:1320px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))!important}
.row{grid-template-columns:40px 74px 92px 1fr 128px 116px 128px}
.flg{display:flex;gap:4px;padding-top:1px}
.fl{display:inline-flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;user-select:none}
.fl input{margin:0;cursor:pointer;accent-color:var(--green)}
.fl span{font-family:var(--disp);font-weight:700;font-size:8px;letter-spacing:.06em;color:var(--muted)}
.fl.fl-set span,.fl.fl-pend span{color:var(--ink)}
.fl.fl-pend input{outline:2px solid var(--yellow);outline-offset:1px}
.row:has(.fl input:checked){background:rgba(74,186,129,.06)}
.com{font-size:12.5px;color:var(--ink-dim);min-width:0;overflow:hidden}
.ef{cursor:pointer;border-bottom:1px dashed transparent;border-radius:2px;padding:0 2px}
.ef:hover{border-bottom-color:var(--ink-dim);background:var(--panel2)}
.pill.ef:hover{filter:brightness(.94)}
.ef .blank{color:var(--muted);font-style:italic;font-size:11.5px}
.ef.ed-pend{box-shadow:inset 0 -2px 0 var(--yellow);background:rgba(255,204,59,.16)}
.ef.ed-open{box-shadow:inset 0 -2px 0 var(--ink-dim)}
.ef.ed-done{box-shadow:inset 0 -2px 0 var(--green)}
.efsel{font-family:var(--body);font-size:12px;max-width:100%;padding:1px 3px;
  border:1px solid var(--ink);border-radius:3px;background:var(--ground);color:var(--ink)}
.chip{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:3px;font-family:var(--mono);
  font-size:10.5px;background:var(--panel2);color:var(--ink-dim);white-space:nowrap}
.chip.over{background:var(--red);color:#fff}
.chip.cost{background:transparent;border:1px solid var(--rule);color:var(--ink)}
.chip.ef{cursor:pointer}
.chip.ef:hover{outline:1px solid var(--ink-dim)}
.chip-empty{background:transparent;border:1px dashed var(--rule);color:var(--muted);font-family:var(--body);font-style:italic}
.chip.ed-pend{outline:2px solid var(--yellow)}
.chip.ed-open{outline:1px solid var(--ink-dim)}
.chip.ed-done{outline:1px solid var(--green)}
.efinp{font-family:var(--mono);font-size:11px;width:118px;padding:1px 4px;
  border:1px solid var(--ink);border-radius:3px;background:var(--ground);color:var(--ink)}
.mmeta dd .chip{margin-left:0}
.cm.st-reply{border-left-color:var(--green);background:var(--panel);padding:6px 0 6px 12px;border-radius:0 3px 3px 0}
.st-reply .cms{background:var(--ink);color:var(--ground)}
.cmcopy{margin-left:auto;background:transparent;border:1px solid var(--rule);border-radius:3px;
  color:var(--ink-dim);cursor:pointer;font-family:var(--disp);font-weight:700;font-size:9px;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 7px}
.cmcopy:hover{color:var(--ink);border-color:var(--ink-dim)}
.cmcopy.copied{background:var(--green);color:#0C2A1C;border-color:var(--green)}
.cm.st-reply .cmb{font-size:13px;line-height:1.6}
.chip.who{background:transparent;border:1px dashed var(--rule);color:var(--ink-dim);font-family:var(--body)}
.mmeta dd.over{color:var(--red);font-weight:700}
.row.hascom{box-shadow:inset 3px 0 0 var(--ink-dim)}
.row.haspend{box-shadow:inset 3px 0 0 var(--yellow)}

.mask{position:fixed;inset:0;background:rgba(20,32,42,.55);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:48px 18px;overflow:auto}
.modal{background:var(--ground);border:1px solid var(--rule);border-radius:6px;
  width:100%;max-width:760px;box-shadow:0 24px 64px rgba(0,0,0,.3);display:flex;flex-direction:column}
.mhead{padding:18px 22px 14px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.mhead .rid{cursor:pointer}
.mhead h3{font-family:var(--disp);font-size:15px;font-weight:700;margin:0;flex:1;line-height:1.4}
.mx{background:transparent;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0 2px}
.mx:hover{color:var(--ink)}
.mmeta{padding:10px 22px 14px;border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--ink-dim)}
.mmeta dl{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;margin:0}
.mmeta dt{color:var(--muted);font-family:var(--disp);font-weight:700;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;padding-top:2px}
.mmeta dd{margin:0}
.mnotes{padding:12px 22px 14px;border-bottom:1px solid var(--rule);max-height:26vh;overflow:auto}
.mnotes h4{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.mnotes p{margin:0;font-size:13px;color:var(--ink-dim);line-height:1.6}
.mlog{padding:6px 22px 14px;max-height:40vh;overflow:auto}
.mlog h4,.madd h4{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.cm{border-left:2px solid var(--rule);padding:2px 0 2px 12px;margin:0 0 12px}
.cm.st-pending{border-left-color:var(--yellow)}
.cm.st-open{border-left-color:var(--ink-dim)}
.cm.st-actioned{border-left-color:var(--green)}
.cmh{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.cmt{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cms{font-family:var(--disp);font-weight:700;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;padding:1px 6px;border-radius:2px}
.st-pending .cms{background:var(--yellow);color:#3D2E00}
.st-open .cms{background:var(--panel2);color:var(--ink-dim)}
.st-actioned .cms{background:var(--green);color:#0C2A1C}
.cmb{font-size:13.5px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.cmdel{margin-left:auto;background:transparent;border:0;color:var(--muted);cursor:pointer;
  font-size:11px;text-decoration:underline}
.cmdel:hover{color:var(--red)}
.nocm{font-size:13px;color:var(--muted);padding:2px 0 8px}
.madd{padding:0 22px 18px}
.madd textarea{width:100%;min-height:88px;font-family:var(--body);font-size:13.5px;
  color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:4px;
  padding:10px 12px;resize:vertical}
.madd textarea:focus{outline:2px solid var(--green);outline-offset:1px}
.mact{display:flex;gap:8px;align-items:center;margin-top:10px}
.hint{font-size:11.5px;color:var(--muted);margin-left:auto}

.savebar{position:sticky;bottom:0;z-index:60;margin:0 -24px -90px;padding:12px 24px;
  background:var(--panel);border-top:1px solid var(--rule);display:flex;gap:10px;align-items:center;
  box-shadow:0 -6px 22px rgba(0,0,0,.10)}
.savebar b{font-family:var(--disp);font-size:13px}
.savebar .sp{margin-left:auto}
.btn.pri{background:var(--green);border-color:var(--green);color:#0C2A1C;font-weight:700}
.btn.pri:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:300;
  background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:4px;font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);max-width:min(560px,92vw)}
.warnbar{margin:14px 0 0;padding:11px 16px;border-left:3px solid var(--yellow);
  background:var(--panel);font-size:13px;color:var(--ink-dim);border-radius:0 3px 3px 0}
@media (max-width:900px){.savebar{margin:0 -16px -70px;padding:10px 16px;flex-wrap:wrap}}

ne line per row. Paste that into chat and I write them into the registers, then rebuild this page with those comments marked \u003cb>actioned\u003c/b>.\u003c/p>\n  \u003cp>\u003cb>Four fields on every row are editable in place: priority, category, community and owner.\u003c/b> Click one, pick from the list, and it turns amber as a pending correction. They ride the same Save and the same Copy as comments, and arrive in chat as \u003ccode style=\"font-family:var(--mono)\">TD-0044: Community -&gt; Riverwalk (was blank)\u003c/code>. The board shows your corrected value straight away; the register is not changed until I write it.\u003c/p>\n  \u003cp>\u003cb>Due date and cost are set the same way.\u003c/b> Every row carries a \u003ccode style=\"font-family:var(--mono)\">+ due\u003c/code> and a \u003ccode style=\"font-family:var(--mono)\">+ cost\u003c/code> chip; click one for a date picker or a box to type into. An overdue date goes red. Filter with \u003cb>Has a date\u003c/b> and \u003cb>Has a cost\u003c/b>.\u003c/p>\n  \u003cp>\u003cb>Ask for a draft in a comment and it comes back in the same thread.\u003c/b> &ldquo;Draft an email to Melanie about the Royal Oaks titles&rdquo; on the row, send it over, and the draft lands as a reply on that row with a \u003cb>copy\u003c/b> button. It never counts as an open comment, because a reply is not something you owe anyone.\u003c/p>\n  \u003cp>\u003cb>The \u003ccode style=\"font-family:var(--mono)\">BW\u003c/code> box on the left flags a row for budget week.\u003c/b> Tick as many as you like and use \u003cb>Budget week only\u003c/b> to read the list back. Flags ride the same Save and the same Copy, and when you send them over I build the budget-week list as its own document. \u003cb>A tick is a filter; a comment is prose\u003c/b> &mdash; use the box for what goes on the list and a comment for why.\u003c/p>\n  \u003cp>\u003cb>A rebuild never wipes your comments, corrections or flags.\u003c/b> The builder reads this page first and c -decisions.md","person":"","due":"","cost":"","q":"Whether InvestNext gets renewed 2026-09-09, six days"},{"id":"PD-38","reg":"Parked decisions","sec":"Resolved","desc":"Is Lamberton Lake actually being sold, and if so by whom. CLAUDE describes it as \"managed and being sold\" and lamberton-lake-mhc carries the same framing. A full history sweep of the mailbox that receives every piece of Lamberton mail found no broker, no listing, no LOI, no buyer and no closing correspondence. What it did find is routine agency loan servicing: a Fannie inspection in May, an insurance renewal cycle opening now, an asset manager asking twice about a utility overrun, and five unanswered annual certification requests. That is the traffic of an asset being held, not one being sold. Either the sale process runs somewhere this Brain cannot see, in which case say where, or the \"bein","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"People","community":"Lamberton Lake MHC","priority":"Closed","state":"CLOSED 2026-09-03, ruled. Austin: \"We need to follow up with dustin it needs to get going now.\" So the asset is being sold, the process has not started, and the label was aspirational rather than stale. The broker is Dustin Wilmer at Marcus and Millichap, and a complete email to him has been sitting drafted and unsent in 60-Communities/drafts/draft-dustin-lamberton.md since 2026-08-26, waiting on nothing but a date. TD-0501. The silence is now 31 days, not the 23 the draft was written against, and the draft has been updated to say so. A second question falls out of this and is not the same question: the $2,000,000 ask has been unchanged since May 2025 with no 2026 opinion of value from anyone, and a stale price with no current BOV is its own reason a listing does not move. TD-0502, and it is Austin and Jon's call, not Dustin's.","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fparked-decisions.md","person":"","du om the End of Day Close","desc":"Is there a separate Belle Haven settlement, and if so what is it. Moved here from the daily close after three asks with no answer, per the rule in end-of-day that a question unanswered three closes running stops being a question and becomes something waiting on a ruling. Asked 2026-08-31, 2026-09-01 and 2026-09-02. The origin is Austin's own correction of 2026-08-31: \"Settlement was in regards to the Mass case, Bellehaven is completely separate.\" was titled \"Belle Haven settlement\" for two days on the strength of a misread, and when the title was corrected every fact filed under it moved with it to Massachusetts. So the phrasing \"completely separate\" reads as a matter that exists in its own ","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Titles","community":"","priority":"Awaiting your ruling","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fparked-decisions.md","person":"","due":"","cost":"","q":"there separate Belle Haven settlement, it. Moved"},{"id":"PD-39","reg":"Parked decisions","sec":"Added 2026-09-03, from the first sweep of the a2zcp mailbox","desc":"Where Austin's private personal section lives in this Brain, and whether it lives here at all. He asked for one on 2026-09-03: \"I need to have a separate section of my brain that is private for my personal life. i need help with that organization like belmart, jamie, key dates, kids, hailey and julia, hailey lax. school events etc.\" A skeleton has been built at 85-Personal/ and it is deliberately empty of content, because two things have to be settled first and neither is guessable. One: it is a fourteenth top level folder, and CLAUDE says add a subfolder, never a top level. The rule is about the business changing shape; a personal life is not a department, which is the argument for the exce","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Uncategorised","community":"","priority":"Awaiting your ruling","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fparked-decisions.md","person":"","due":"","cost":"","q":"Austin's private personal section lives Brain, whether"},{"id":"PD-40","reg":"Parked decisions","sec":"Added 2026-09-03, from the first sweep of the a2zcp mailbox","desc":"Does the personal Google account get disconnected, or just not read. Austin, 2026-09-03: \"i updated the connection in gmail to a2zcp / bedrock email account from personal. nothing in personal.\" The Gmail connection moved. The Google Drive connection did not, and was tested the same day still authenticating as austinrberk@gmail.com against the personal My Drive root. So there are two readings of \"nothing in personal\" and they lead different places. Reading one, and the one now written into the rules: it is a content instruction. Nothing gets harvested from the personal account and no register row is built out of it, but the connector stays where it is. Reading two: the personal account should","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Finance","community":"","priority":"Awaiting your ruling","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fparked-decisions.md","person":"","due":"","cost":"","q":"Does personal Google account get disconnected, just"},{"id":"KP-0001","reg":"Known problems","sec":"Needs action now","desc":"SOP 302 publishes a lender's full wire instructions — account name, account number, beneficiary bank and ABA routing number — in a document that circulates through the process wiki. Direct fraud exposure. The SOP's own text says payment instructions vary by lender and should be taken from the notice, which is the fix. Detail at 302-home-lender-repo.","notes":"CLOSED 2026-09-01 on Austin's word: the SOP was updated and the lender's payment credentials removed. He did not say which artefact was edited or whether the wiki copy and any circulated PDFs were re-issued, and that is recorded as unknown rather than assumed. The finding text above is kept so the exposure that produced the fix stays legible.","owner_short":"Austin Berk","owner_full":"Austin — reassigned from David Berman 2026-09-01 on the board. He made the fix, so he owns the confirmation that it reached every circulated copy.","category":"Finance","community":"","priority":"Closed","state":"CLOSED 2026-09-01 — Austin: \"Updated and information removed.\"","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"","cost":"","q":"SOP 302 publishes lender's full wire instructions"},{"id":"KP-0002","reg":"Known problems","sec":"Needs action now","desc":"The Employee Handbook has no effective date, revision date or version number, and its state addendum covers AL, FL, MD, MA, NC and WV but not Georgia or South Carolina, where the company holds dealership licences and operates. First step is confirming we have the current version — email drafted at 2026-08-31-demetria-handbook-version. Question the contents only after that comes back.","notes":"2026-09-01, Austin: \"Draft email request to Demetria.\" The draft has been ready since 2026-08-31 at 2026-08-31-demetria-handbook-version. A second attempt to place it in Outlook Drafts on 2026-09-01 was refused again — Graph 403, Mail.ReadWrite is not admin-consented on the app registration. The blocker is a tenant consent, not the email. Copy the block out of the draft page, or have IT consent Mail.ReadWrite, Mail.Send and Calendars.ReadWrite once.","owner_short":"Demetria Loukas","owner_full":"Demetria Loukas","category":"People","community":"","priority":"Blocked","state":"open — draft ready, Outlook write still blocked","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"","cost":"","q":"Employee Handbook effective date, revision date version"},{"id":"KP-0003","reg":"Known problems","sec":"Needs action now","desc":"Accounting runs 30 to 45 days in arrears. Transactions are not booked until month-end, so there is no live spend visibility. Austin names it as one of his top three problems. Function-level, recorded at accounting-and-finance.","notes":"2026-09-01, Austin: the arrears problem is \"changing with the changes in the department,\" and he named a specific build — an agent to book Ramp charges. That is the first concrete mechanism attached to this finding rather than a restatement of it. Brief at ramp-charge-coding-agent; task . The department change is the Berman exit (commitments item 16), so the fix and the transition are the same window.","owner_short":"David Berman","owner_full":"David Berman","category":"Finance","community":"","priority":"Critical (stated)","state":"open — scope widened 2026-09-01","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"","cost":"","q":"Accounting runs days arrears. Transactions booked until"},{"id":"KP-0004","reg":"Known problems","sec":"Needs action now","desc":"The scorecard cannot be scored. KPI names live in the Rocks file with no targets, units, frequency or definitions; the numeric year-end targets live only in the March deck, and the two have never been reconciled. Six of twenty targets have no KPI name at all. Fixing this is Zach's own Q1 rock. Detail at scorecard.","notes":"2026-09-01, Austin: follow up with Zach and discuss quarterly. Recorded as under Austin, to be raised in the Tuesday 14:00-17:00 ET one-on-one block. Quarterly is the review cadence, not the fix date — the scorecard is Zach's own Q1 rock and the targets still need units, frequency and definitions before anything can be scored.","owner_short":"Zach Schwartz","owner_full":"Zach Schwartz","category":"Finance","community":"","priority":"High (stated)","state":"open — quarterly follow-up set","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"","cost":"","q":"scorecard cannot scored. KPI names live Rocks"},{"id":"KP-0005","reg":"Known problems","sec":"Needs action now","desc":"The five Phase 1 decisions in the SOP program are all waiting on people, not on writing. Florida's cure period, eviction at 107 or 800, which closing generation governs, JotForm or FastField, and the SC/GA notice periods. Kickoff proposed for Wednesday 2026-09-02, 1:30 to 3:00pm ET.","notes":"","owner_short":"Austin Berk","owner_full":"Austin with Natalie","category":"Legal","community":"","priority":"Critical (stated)","state":"open — see year-end-push","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"","cost":"","q":"five Phase decisions SOP program all waiting"},{"id":"KP-0006","reg":"Known problems","sec":"Needs action now","desc":"A resident pointed a gun at contractors at Lucky Clover, and a second threatened self-harm. The manager was alone on-site. Eleven days open, no named owner, silent across five channels. The 2026-08-28 L10 passed without it being raised. Needs a trespass and law-enforcement path, not sympathy.","notes":"CLOSED 2026-09-01. Austin: \"This has been handled by the team on site.\" What was done is deliberately not written up, because nobody reported it and inventing a plausible account of a firearms incident is the item-20 failure repeated. What the closure does not settle: there is still no written trespass, law-enforcement and eviction protocol, and the next lone manager facing this has nothing to follow. That gap is now , not this row.","owner_short":"Unassigned","owner_full":"unassigned — settle at the Monday 08:30 with Jon","category":"People","community":"","priority":"Closed","state":"CLOSED 2026-09-01 — handled on site","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"","cost":"","q":"resident pointed gun contractors Lucky Clover, second"},{"id":"KP-0007","reg":"Known problems","sec":"Needs action now","desc":"Great Oak is under a boil water notice with the aerator pump out and the vendor absent. Called the most urgent property item in the portfolio on 2026-08-26. Eleven days, no owner. The construction call led its agenda with Great Oak and never mentioned it, which means the item has no forum rather than that it was handled.","notes":"CLOSED 2026-09-01. Austin: \"This has been handled by the team on site.\" Recorded as resolved on his word. No lift order, vendor confirmation or clearing sample result is filed anywhere in this Brain, so if a regulator asks for the paper the answer is currently at the property, not here. Retrieving it is .","owner_short":"Unassigned","owner_full":"unassigned — same forum","category":"Utilities","community":"","priority":"Closed","state":"CLOSED 2026-09-01 — handled on site","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"","cost":"","q":"Great Oak under boil water notice aerator"},{"id":"KP-0008","reg":"Known problems","sec":"Needs action now","desc":"Corporate securities records sit under a personal Gmail account. austinrberk@gmail.com is a standing member of three corporate Google Shared Drives holding cap tables, fund subscriptions, K-1s, an LPA and executed signature pages, outside any Workspace admin lifecycle and invisible to a standard audit query. Three drives is a floor — memberships cannot be enumerated.","notes":"2026-09-01, Austin: \"What does this mean? Need more clarity on the task at hand.\" Fair — the row described the exposure and never stated the ask. Plain version: your personal Gmail account is a member of at least three corporate Google Shared Drives holding cap tables, fund subscription docs, K-1s, an LPA and executed signature pages. Those drives sit outside the company's Workspace, so no admin can see them, no offboarding process governs them, and an audit of company systems reports clean while the documents live in a consumer account. The ask is two decisions, not a project: (1) do those drives move into a company-controlled Workspace or stay where they are with the risk accepted in writi  […]  root. The mail identity moved; the Drive identity did not, and this exposure is exactly where it was on 2026-09-01. Detail on connector-status. REVISED 2026-09-03 after the Drive connector was switched to austin@a2zcp.com and all four Shared Drives still returned. The corporate account carries a view history on these drives going back weeks before the switch, and a switch cannot manufacture one, so both accounts have been members all along. Half of this row was never true: if the personal Gmail were lost or compromised, continuity would NOT sit outside company control, because the corporate account reaches every drive and always did. That sentence is struck. What stands is the whole of it now: a consumer Gmail account holds standing membership in corporate Shared Drives containing cap tables, fund subscriptions, K-1s, an LPA and executed signature pages. That is a removal, not a migration, and it is one action rather than a project. Why this Brain got it wrong: the original survey walked in from the personal account and recorded reachable-from-here as reachable-only-from-here. Nothing tested the corporate account, because the corporate account was not connected. Rule 15's failure mode in connector form. Downgraded Critical to High on the strength of the continuity claim falling.","owner_short":"Austin Berk","owner_full":"Austin with Albert","category":"Finance","community":"","priority":"Critical (stated)","state":"open, revised 2026-09-03, now a removal task","lot":"","age":null,"srcurl":"","srctype":"", l emails, confirming either no adverse evidence on the contractor or the contrary facts plus a rationale to proceed — with Jadian's CCO on the record where bad practices are known. Nothing in 34 process pages does this. It is a per-contract control and cheap to add. Detail at responsible-contractor-program.","notes":"2026-09-01, Austin: \"Responsible Contractor Review added to compliance calendar. Also needs to be added to Accounting procedures and handbook.\" Three artefacts, not one — the calendar entry (), a gate inside the AP/contract approval procedure, and a handbook clause. The gate is the one that does the work; the calendar only reminds you it exists. Due 2026-09-30 with the rest of this block. . 2026-09-01, Austin: \"This is a high priority task assigned to me. I want to work with Zach, Natalie, Melanie, and Moe on these. This is a must with the current situation and turnover.\" Owner Austin, working group Zach Schwartz, Natalie Magurne, Melanie Sanchez-Soto, Moe Mehmood. \"The current situation and turnover\" is the Berman exit (commitments item 16) — the calendar is the thing that survives a departure, which is why it is a must now rather than a nice-to-have. It carries the Jadian obligations, the Florida January 1 Division filing, the 7-year retention standards, the insurance renewals, and now the Responsible Contractor review from . Melanie held licences and permits before Berman, so she is the one person in the group who has run this calendar in practice. .","owner_short":"Accounting","owner_full":"Accounting team — proposed lead: Moe Mehmood, with Demetria Loukas on the handbook clause only","category":"Finance","community":"","priority":"High (stated)","state":"Austin with Zach, Natalie, Melanie, Moe — high priority, raised 2026-09-01","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"2026-09-30","cost":"","q":"Responsible Contractor Review section exists any contract"},{"id":"KP-0012","reg":"Known problems","sec":"Jadian obligations","desc":"No list of interested Responsible Contractors exists. Section VI.E.2.b of the Policy makes maintaining one, with names, addresses and telephone numbers, an explicit duty of the operating company manager.","notes":"2026-09-01, Austin: \"Needs to be completed with KP-0011. Both should be assigned to the accounting team.\" Same package, same owner, same date. The list is the cheap half — names, addresses and phone numbers of interested contractors, which AP already holds in the vendor master. Building it from the vendor master is a morning's work; keeping it current is the part that needs the gate in . .","owner_short":"Accounting","owner_full":"Accounting team — proposed lead: Moe Mehmood","category":"People","community":"","priority":"High (stated)","state":"open — due 2026-09-30","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=00-Meta%2Fopen-items.md","person":"","due":"2026-09-30","cost":"","q":"list interested Responsible Contractors exists. Section VI.E.2.b"},{"id":"KP-0013","reg":"Known problems","sec":"Jadian obligations","desc":"The annual Responsible Contractor audit may not have happened, and the 2026 cycle is due. Cadence is annual. One report exists, as of 2025-09-30. A compilation of signed certifications and Google News searches is not an audit of pay practices.","notes":"2026-09-01, Austin: \"This needs to be done as of 9/30/2026. This now becomes the due date for KP-0011 through 0014.\" He floated Moe and Zach together, or HR. Recommendation on the page, argued below in Decisions: Zach owns it, Moe supplies the data, HR gets only the handbook clause. The prior report, as of 2025-09-30, is a compilation of signed certifications and Google News searches. That is not an audit of pay practices, so the 2026 cycle is a build rather than a refresh. .","owner_short":"Zach Schwartz","owner_full":"Zach Schwartz — proposed, with Moe Mehmoo s own status column"},{"id":"TD-0401","reg":"EOS to-dos","sec":"Routed from Austin's 2026-09-01 board comments, second pass","desc":"Answer the four entity questions only Austin can. THREE OF FOUR ANSWERED 2026-09-02 on the board, verbatim: \"1) No this was not formed and going to be formed at some point. 2) Crystal Acres - Kippy Single Asset. 3) HSRC was Parakeets property. Sold to HSMHC which is Kippy and has a seller note from HSRC\" (1) The trust was never formed - and the half he did not answer is who holds that 5% today (). (2) Crystal Acres is a Kippy single asset, so both options in the question were wrong; corroborated the same morning on the rehab call. (3) Hunter Springs: HSRC was Parakeet's, sold to HSMHC which is Kippy, and HSRC holds a seller note - a second Parakeet-to-Kippy paper relationship (, ). (4) Gulf ","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Construction","community":"","priority":"Open","state":"open - 3 of 4 answered, Gulf Breeze outstanding","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Answer four entity questions Austin can. FOUR"},{"id":"TD-0402","reg":"EOS to-dos","sec":"Routed from Austin's 2026-09-01 board comments, second pass","desc":"Record on portfolio that the 67-row Property Data Sheet is scoped to the Parakeet MHC ownership family, not to everything the warehouse reports. The master org chart shows three distinct families; Cedar Grove, Colonial, Lambeth and Cambridge sit under Bedrock Fund II / Grove Banyan, and the ND, Kansas and Michigan assets under A2Z legacy and the Post joint ventures. The sheet is not incomplete, it is scoped, and nothing said so — which is why read four live communities as missing.","notes":"","owner_short":"Zach Schwartz","owner_full":"Zach Schwartz","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype d units carrying $989,786 of GL spend. This answers whether roughly a million dollars is stuck in work-in-progress for finished homes or has been capitalised properly. It is a query, not a project. Start with Belle Haven — $289,254 of the total, and 17 of its 18 units are complete.","notes":"","owner_short":"Unassigned","owner_full":"unassigned — the Controller seat; Austin to name at the Friday 14:00 ET Executive EOS call","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Pull WIP trial balance vehicle diff against"},{"id":"TD-0406","reg":"EOS to-dos","sec":"Routed from the rehab tracker ingest, 2026-09-02","desc":"Assign WIP/GL codes to the 12 units that have none, before their invoices arrive. None of them carries booked spend yet, so nothing has gone to a default account so far. Cheapest item in the entire program and it has a natural deadline. Unit list on the reconciliation page.","notes":"","owner_short":"John Clark","owner_full":"John Clark to supply the units, Accounting to assign the codes","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Assign WIP codes units none, before invoices"},{"id":"TD-0407","reg":"EOS to-dos","sec":"Routed from the rehab tracker ingest, 2026-09-02","desc":"NOT ASKED at the 2026-09-02 call — and Mark volunteered something that changes the odds. Unprompted, on the tracker: \"I've convoluted some of the accounting... probably a couple that I could wash through,\" and on why sold rows must stay: \"when I had to move money around, and I've still got to square. I'll do some accounting on the plane.\" The vendor is manually adjusting his own sheet between calls and has squaring still to do. That does not answer the question but it raises the priority, and it is evidence for the over-priced-tracker branch rather than the missing-accrual branch. Ask it at the 2026-09-09 call. Original ask: are the nine units where your tracker sits $163,123 above our GL in","notes":"","owner_short":"Austin Berk","owner_full":"Austin — he is on the call","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"ASKED 2026-09-02 call Mark volunteered something changes"},{"id":"TD-0408","reg":"EOS to-dos","sec":"Routed from the rehab tracker ingest, 2026-09-02","desc":"Handle the ten Silver Breeze units as one item, not ten. SILVER-5, 8, 10, 20, 23, 30, 31, 35, 37, 38 — all In Progress, all started 2026-04-17, all 131 days old, all High Pace. Ten units frozen on a single date is one batch that never got worked. Get a date or a reason for the batch. And pick up SILVER-42 with them: In Progress, High Pace, no start date at all, so it is not even on the 60-day clock. ANSWERED 2026-09-02 at the Weekly Rehabs Call, without being asked. Mark Doucette: \"We will be complete and out of Silver Breeze rehabs by Thursday of next week\" —","notes":"2026-09-10. All eleven, SILVER-42 included. Two things the date does not cover: unit 8 took a roof leak in a rainstorm after the drywall went in and now needs a new roof, which is added scope inside a closing date (); and blinds and a glass repair are still outstanding, which Mark treats as a gate — \"I don't turn them over to you till they're installed.\" Verify the turnover on 2026-09-11 rather than closing this row on the promise.","owner_short":"John Clark","owner_full":"John Clark with Mark Doucette","category":"Construction","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&fi null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Give Eastdil update Austin owes them, ask"},{"id":"TD-0442","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Decide the Plaud team account, then fix adoption, which is the actual problem. The vendor has offered a team account at the same price, which would let recordings be bucketed and shared - the August road trip is the worked example. But one founder does not have the current device and another will not run two recorders, so the account alone changes nothing. The desktop app auto-recording Teams calls is the highest-leverage piece.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Decide Plaud team account, then fix adoption,"},{"id":"TD-0443","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Call Jim about the KPIs rather than emailing him. Austin's own read on the call: a phone call works better because Jim needs an approval of his own. The KPIs are owed to Jon and Zach.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Uncategorised","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Call Jim about KPIs rather than emailing"},{"id":"TD-0444","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Identify which Lake Wales homes sit on more than one lot. That is the filter the 09-02 call agreed: two-lot homes wait, homes becoming a small new or small existing home proceed. For the two-lot homes needing demolition, the cleanout price rolls into the demo price. The vendor is holding and can be re-pointed in two days.","notes":"","owner_short":"Natalie Magurne","owner_full":"Natalie Magurne with John Clark","category":"Construction","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Identify Lake Wales homes sit more than"},{"id":"TD-0445","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Hold the operational catch-up on the Lake Wales plan. Jon on the call: it has never had a full loop, and the rehab decision was paused partly because the direction may change. The rehabs are the symptom; the missing plan is the item.","notes":"","owner_short":"AB/JW","owner_full":"Austin with Jon Wyss and Natalie Magurne","category":"Construction","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Hold operational catch-up Lake Wales plan. Jon"},{"id":"TD-0446","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Confirm the Hunter Springs go-ahead, and say who pays and who signs off. The call approved $20,000, \"lipstick on the pig\", and a sign-off that we rehab them by November, conditional on \"other things falling in line.\" established the same day that Parakeet sold Hunter Springs to a Kippy entity and holds a seller note on it, so neither the payer nor the counterparty giving the November sign-off is obvious from the call. Answer that before the crew moves off Silver Breeze on 2026-09-10.","notes":"","owner_short":"Austin Berk","owner_full":"Austin with John Clark","category":"Construction","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Confirm Hunter Springs go-ahead, say pays signs"},{"id":"TD-0447","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Get the Belle Haven window lot list to the vendor so he can quote three suppliers. He is blocked on the list, not the price. On lot 20, Lansing beat everyone by 10 to 15%; Mobile Home Depot stocks few standard sizes so these are effectively custom. The crank-out single-pane units are the ones that must be replaced rather than flashed. Reminder already sent to the two people who owe it.","notes":"","owner_short":"Natalie Magurne","owner_full":"Natalie Magurne","category":"Construction","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Get Belle Haven window lot list vendor"},{"id":"TD-0448","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Write the new rehab inspection protocol into the SOP. Agreed on the 09-02 call: while a rehab is in progress the crew checks HVAC, hot water heater, roof and, as far as possible, windows. The SOP does not say this today. The vendor named the limit honestly, that it cannot be caught during leveling and a roof leak is often only findable in the rain, and the limit belongs in the SOP too.","notes":"","owner_short":"Natalie Magurne","owner_full":"Natalie Magurne","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Write new rehab inspection protocol SOP. Agreed"},{"id":"TD-0449","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Price the Fox Creek HVAC replacements as one bulk decision, rehab homes and occupied rentals together, and price mini splits against package units while doing it. Fox Creek started with 120 rentals and has a heavy AC repair run with replacements coming due; the units are large package units at two to two and a half tons. The vendor's Silver Breeze alternative is roughly $3,500 installed for two one-ton mini splits, which he rates highly and also flags as unproven over time. Twenty units done together is a capex decision, not twenty repairs.","notes":"","owner_short":"Natalie Magurne","owner_full":"Natalie Magurne with John Clark","category":"Construction","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Price Fox Creek HVAC replacements bulk decision,"},{"id":"TD-0450","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Fix the rehab tracking sheet: formulas, spacing and numbering. Asked for by the vendor on the call, by name. Two things must survive the cleanup: the closed red rows stay, because they are retained for deposit purposes and money was moved between them, and three newly added units plus one at The Oaks under assessment need to land correctly. overview was built off a 2026-08-28 export of this sheet, so the fix changes what those pages should say.","notes":"","owner_short":"Zach Schwartz","owner_full":"Zach Schwartz","category":"Construction","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Fix rehab tracking sheet formulas, spacing numbering."},{"id":"TD-0451","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Give the vendor the separate skirting call he asked for. His words: he has \"convoluted some of the accounting\" on skirting, while turnovers are current on billing and accounting dates. A vendor volunteering that his own accounting is tangled is the cheapest warning anyone gets.","notes":"","owner_short":"John Clark","owner_full":"John Clark with Accounting","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Give vendor separate skirting call asked for."},{"id":"TD-0452","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Decide what happens to the Silver Breeze security patrol when it expires. A 9pm to 5am patrol is in place on a 30-day term, which leaves roughly two weeks of cover after rehabs complete on 2026-09-10. Cabinets were taken from a unit under renovation and windows were broken. The vendor's view is that occupancy in the finished homes changes the risk. No resident is named on this row on purpose - guardrail 5.","notes":"","owner_short":"Natalie Magurne","owner_full":"Natalie Magurne","category":"Construction","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Decide happens Silver Breeze security patrol expires."},{"id":"TD-0453","reg":"EOS to-dos","sec":"Routed from the 2026-09-02 board pull and the two morning recordings","desc":"Rule on the vendor's offer to let the company buy window units at cost through his Home Depot Pro account. He offered it unprompted, with no markup, charged to a company card. Taken at face value it saves real money and is straightforwardly generous. It still needs Austin's yes or no, because spend on a vendor's trade account sits outside the company's own purchasing controls.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Rule vendor's offer let company buy window"},{"id":"TD-0454","reg":"EOS to-dos","sec":"Routed from Austin's 2026-09-02 dispositions on FastField Phase I","desc":"Define the single master community list and configure it identically across all 13 FastField forms. Austin's ruling: \"Community Dropdown needs to be configured to be from the same list in all fields. This is part of the task to clean up the forms.\" Worth ordering deliberately: as ruled it is thirteen per-form fixes; defining the master list once before the remaining twelve are converted is the same work at a thirteenth of the cost. has widened past this project, four different community counts across four documents in the QuickBase drop. Check FF-12 first, since it is already built and its Community field is either a free-text box or a 65-item list.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Uncategorised","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Define single master community list configure identically"},{"id":"TD-0455","reg":"EOS to-dos","sec":"Routed from Austin's 2026-09-02 dispositions on FastField Phase I","desc":"Build the Community, Lot, Asset cascading lists in FastField, and make the platform call they depend on. Austin: \"Yes this is true need cascading lists built.\" The decision inside the task: full status filtering needs FastField Enterprise API integration, while the cascade map's own fallback is pre-populating Community and Lot from QuickBase by QR code or link launch. The fallback is better for adoption, because field staff never hand-select. Nobody has chosen, and the choice changes what gets built. Depends on Lot Status and Asset Status being maintained by QuickBase automations that do not exist yet.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Build Community, Lot, Asset cascading lists FastField,"},{"id":"TD-0456","reg":"EOS to-dos","sec":"Routed from Austin's 2026-09-02 dispositions on FastField Phase I","desc":"Sweep the SOP library and change every JotForm reference to FastField. Austin: \"All JotForm refrences need to be updated to FastField.\" This closes the question behind three existing rows: (Natalie, settle the platform question and produce the form ecosystem document), (SOP 001 cannot decide between the platforms inside its own text) and the platform half of (SOP 201's JotForm Home Drop Confirm link). The tracker's \"Jotform Process (Form Ecosystem)\" Tier 2 row, nothing started, now has its answer. Scope is at least SOP 001, 105, 105b, 122 and 201, and SOP 105 contradicts itself inside a single task.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Systems & data","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Sweep SOP library change every JotForm reference"},{"id":"TD-0457","reg":"EOS to-dos","sec":"Routed from Austin's 2026-09-02 dispositions on FastField Phase I","desc":"Review whether the AI Form Converter carries photo and file capture. Austin: \"Will review.\" 8 of the 13 forms need it, it is absent from the vendor's documented recognised-field list, and it is the reason FastField is the front end at all. FF-12 proved nothing about it, having no file uploads. FF-05 Weekly Maintenance Checklist is the test: 40 fields, no conditional logic, file uploads yes.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Uncategorised","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Review whether Form Converter carries photo file"},{"id":"TD-0458","reg":"EOS to-dos","sec":"Routed from Austin's 2026-09-02 dispositions on FastField Phase I","desc":"Rule on whether the four untracked FastField forms join the Phase I register or stay with the parent project. Home Delivery Confirmation, the 89-item Construction Inspection Checklist and the 71-item Ops & Sales Readiness Checklist from WF001's locked spec, plus SOP 122's Weekly PPE Inspection Checklist, which does not exist. \"Create all 13\" answers the JotForm audit's list; the FastField build is bigger than 13. WF001 is in build with the QuickBase vendor team now, so three of the four are on the critical path today. Related to , which asks who builds them; this asks where they are tracked.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Rule whether four untracked FastField forms join"},{"id":"TD-0459","reg":"EOS to-dos","sec":"Routed from Jon's August roadtrip field report, 2026-09-02","desc":"Hand the field-item block to Property Operations, with regionals taking their own communities. After today there are 265 unowned field rows from this one trip - the 150 harvested 2026-08-31 ( to ) plus 115 added today. This is the same finding twice. The 2026-08-31 audit row said 150 of 163 unowned corporate to-dos were field items sitting here by accident, recommended exactly this handoff, and nothing happened; the block has since grown by 77%. The proof the fix works is next door - open-items carried 331 property rows with one unowned, because someone did an assignment pass there once. Forum: the Friday Executive EOS call. Austin's call because it moves work between two directors.","notes":"","owner_short":"Austin Berk","owner_full":"Austin Berk","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Hand field-item block Property Operations, regionals taking"},{"id":"TD-0460","reg":"EOS to-dos","sec":"Routed from Jon's August roadtrip field report, 2026-09-02","desc":"Confirm Greene Pointe is actually being covered. The field report logs one item for it - \"get rid of the chain fences, redo roads and put in curbs\" - and Greene Pointe appears in no register in this Brain before 2026-09-02. 95 units, Summerville SC, JREF II, regional LS. A park that needs roads, curbs and fencing replaced does not plausibly have zero open items; either it was barely visited or it is missing from the follow-up harvests. Check it against Natalie's regional map and the Rent Manager coverage list. .","notes":"","owner_short":"Unassigned","owner_full":"unassigned - no owner named in the source; Property Operations is the natural seat","category":"Finance","community":"","priority":"Open","state":"open","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Confirm Greene Pointe actually being covered. field"},{"id":"TD-0469","reg":"EOS to-dos","sec":"From the End of Day Close, 2026-09-02","desc":"Establish what comparable set CBRE is using, and correct it now if it is the wrong one. Wallack told the room on 2026-09-02 that CBRE will hand over its comps and that Parakeet agrees in principle to Option 1, so the comps go to plaintiffs' counsel rather than staying internal, and the report lands around 2026-09-11. says the comp-set choice is recorded nowhere as a decision. MH and RV against single family and apartments, or against other Massachusetts manufactured housing communities, decides the fair-market number the case turns on. One email to Wallack asking what CBRE was instructed to benchmark against.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Legal","community":"","priority":"Open","state":"open, before the report lands","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"Establish comparable set CBRE using, correct now"},{"id":"TD-0470","reg":"EOS to-dos","sec":"From the End of Day Close, 2026-09-02","desc":"SUPERSEDED by , kept rather than deleted. Give McNamara a time. He replied 2026-09-02 17:58 ET \"I am available any time 9 am to 6 pm outside of 1:30-2:00. What time works best for you?\" after Austin asked twice the same day for times. The ball is on Austin's side and it is one line. The call covers the A2Z Fund I workbook and Citrin's reconciled version, which differs from Austin's because several members show five payments and one shows a different count.","notes":"","owner_short":"Austin Berk","owner_full":"Austin","category":"Uncategorised","community":"","priority":"Open","state":"open, tomorrow","lot":"","age":null,"srcurl":"","srctype":"","regurl":"obsidian://open?vault=My%20Brain&file=10-Business%2Feos%2Fto-dos.md","person":"","due":"","cost":"","q":"SUPERSEDED kept rather than deleted. Give McNamara"},{"id":"TD-0471","reg":"EOS to-dos","sec":"From the End of Day Close, 2026-09-02","desc":"Confirm whether David Berman is out Thursday as well as Friday, and cover the two Thur <script>
"use strict";
/* The Open Board — rendered from data so the page can republish itself.
   Comment lifecycle: pending (this browser only) -> open (saved into the
   published page) -> actioned (Claude wrote it into the register). */

var BOARD = JSON.parse(document.getElementById("board").textContent);
var ROWS = BOARD.rows, META = BOARD.meta;
var COM = BOARD.comments || {};          /* id -> [{ts,text,state}] */
var DRAFT_KEY = "openboard.pending.v1";
var EDIT_KEY = "openboard.edits.v1";
var FLAG_KEY = "openboard.flags.v1";
var VIEW_KEY = "openboard.view.v1";

/* ---------- pending comments kept out of the published data ---------- */
var PEND = {};
try {
  var raw = localStorage.getItem(DRAFT_KEY);
  if (raw) PEND = JSON.parse(raw) || {};
} catch (e) { PEND = {}; }
function savePend() {
  try {
    if (Object.keys(PEND).length) localStorage.setItem(DRAFT_KEY, JSON.stringify(PEND));
    else localStorage.removeItem(DRAFT_KEY);
  } catch (e) {}
}
function pendCount() { var n = 0; for (var k in PEND) n += PEND[k].length; return n; }

/* ---- field corrections: same three states as comments ---- */
var EDITS = BOARD.edits || {};          /* id -> {field: {from,to,ts,state}} */
var PEDIT = {};                          /* pending, this browser only */
try { PEDIT = JSON.parse(localStorage.getItem(EDIT_KEY) || "{}") || {}; } catch (e) { PEDIT = {}; }
function saveEdits() {
  try {
    if (Object.keys(PEDIT).length) localStorage.setItem(EDIT_KEY, JSON.stringify(PEDIT));
    else localStorage.removeItem(EDIT_KEY);
  } catch (e) {}
}
/* ---- flags: a tick that puts a row on a named list ---- */
var FLAGS = BOARD.flags || {};           /* id -> {flag: {ts,state}} */
var PFLAG = {};
try { PFLAG = JSON.parse(localStorage.getItem(FLAG_KEY) || "{}") || {}; } catch (e) { PFLAG = {}; }
function saveFlags() {
  try {
    if (Object.keys(PFLAG).length) localStorage.setItem(FLAG_KEY, JSON.stringify(PFLAG));
    else localStorage.removeItem(FLAG_KEY);
  } catch (e) {}
}
var FLAGDEFS = (META.flags || [{ key: "budget", label: "Budget week", short: "BW" }]);
function flagOf(id, k) {
  var a = (PFLAG[id] || {})[k], b = (FLAGS[id] || {})[k];
  return a || b || null;
}
function flagOn(id, k) { var f = flagOf(id, k); return !!f && f.state !== "removed"; }
function flagCount() { var n = 0; for (var id in PFLAG) n += Object.keys(PFLAG[id]).length; return n; }
function setFlag(id, k, on) {
  var cur = flagOn(id, k);
  if (on === cur) return;
  var saved = (FLAGS[id] || {})[k];
  if (saved && (saved.state !== "removed") === on) { delete (PFLAG[id] || {})[k];
    if (PFLAG[id] && !Object.keys(PFLAG[id]).length) delete PFLAG[id]; }
  else (PFLAG[id] = PFLAG[id] || {})[k] = { ts: stamp(), state: on ? "pending" : "removed" };
  saveFlags(); refreshRow(id);
}
function openFlags() {
  var out = [];
  ROWS.forEach(function (r) {
    FLAGDEFS.forEach(function (d) {
      var f = flagOf(r.id, d.key);
      if (f && f.state === "pending") out.push([r.id, d.label, "on"]);
      else if (f && f.state === "removed" && (FLAGS[r.id] || {})[d.key]) out.push([r.id, d.label, "off"]);
    });
  });
  return out;
}
var FIELDS = [["priority", "Priority"], ["category", "Category"],
              ["community", "Community"], ["owner_short", "Owner"],
              ["due", "Due date"], ["cost", "Est. cost"]];
var FIELD_TYPE = { due: "date", cost: "text" };
function editOf(id, f) {
  var a = (PEDIT[id] || {})[f], b = (EDITS[id] || {})[f];
  return a || b || null;
}
function shown(r, f) {
  var e = editOf(r.id, f);
  return e && e.state !== "actioned" ? e.to : (r[f] || "");
}
function editCount() {
  var n = 0;
  for (var id in PEDIT) n += Object.keys(PEDIT[id]).length;
  return n;
}
function openEdits() {
  var out = [];
  ROWS.forEach(function (r) {
    FIELDS.forEach(function (f) {
      var e = editOf(r.id, f[0]);
      if (e && e.state !== "actioned") out.push([r.id, f[1], e.from || "(blank)", e.to || "(blank)"]);
    });
  });
  return out;
}
function setEdit(id, f, to) {
  var r = rowById(id); if (!r) return;
  var cur = shown(r, f);
  if (to === cur) return;
  (PEDIT[id] = PEDIT[id] || {})[f] = { from: r[f] || "", to: to, ts: stamp(), state: "pending" };
  saveEdits(); refreshRow(id);
}
function rowById(id) {
  for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === id) return ROWS[i];

  if (!n) { bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  var nc = pendCount(), ne = editCount(), nf = flagCount();
  var what = [];
  if (nc) what.push(nc + " comment" + (nc > 1 ? "s" : ""));
  if (ne) what.push(ne + " correction" + (ne > 1 ? "s" : ""));
  if (nf) what.push(nf + " flag" + (nf > 1 ? "s" : ""));
  bar.innerHTML = "<b>" + what.join(" and ") + " not saved yet</b>" +
    '<span class="sp"></span>' +
    '<button class="btn" id="bdiscard">Discard unsaved</button>' +
    '<button class="btn" id="bcopy">Copy open comments</button>' +
    '<button class="btn pri" id="bsave"' + (READONLY ? " disabled" : "") + ">Save to the page</button>";
  document.getElementById("bcopy").onclick = copyOpen;
  document.getElementById("bdiscard").onclick = function () {
    if (!confirm("Discard " + (pendCount() + editCount() + flagCount()) + " unsaved change(s)?")) return;
    var ids = Object.keys(PEND).concat(Object.keys(PEDIT)).concat(Object.keys(PFLAG));
    PEND = {}; savePend(); PEDIT = {}; saveEdits(); PFLAG = {}; saveFlags(); PFLAG = {}; saveFlags();
    ids.forEach(refreshRow); updateBar(); toast("Unsaved changes discarded.");
  };
  document.getElementById("bsave").onclick = doSave;
}
function copyOpen() {
  var lines = [];
  ROWS.forEach(function (r) {
    openFor(r.id).forEach(function (c) { lines.push(r.id + ": " + c.text); });
  });
  openEdits().forEach(function (e) {
    lines.push(e[0] + ": " + e[1] + " -> " + e[3] + "   (was " + e[2] + ")");
  });
  openFlags().forEach(function (f) {
    lines.push(f[0] + ": " + (f[2] === "on" ? "FLAG " : "UNFLAG ") + f[1]);
  });
  if (!lines.length) { toast("Nothing open to copy."); return; }
  copy(lines.join("\n"));
  toast("Copied " + lines.length + " line" + (lines.length > 1 ? "s" : "") + ". Paste into chat.");
}
function mergeEdits() {
  var out = {};
  for (var k in EDITS) { out[k] = {}; for (var f in EDITS[k]) out[k][f] = EDITS[k][f]; }
  for (var id in PEDIT) {
    out[id] = out[id] || {};
    for (var f2 in PEDIT[id]) {
      var e = PEDIT[id][f2];
      out[id][f2] = { from: e.from, to: e.to, ts: e.ts, state: "open" };
    }
  }
  return out;
}
function mergeFlags() {
  var out = {};
  for (var k in FLAGS) { out[k] = {}; for (var f in FLAGS[k]) out[k][f] = FLAGS[k][f]; }
  for (var id in PFLAG) {
    out[id] = out[id] || {};
    for (var f2 in PFLAG[id]) {
      var e = PFLAG[id][f2];
      if (e.state === "removed") delete out[id][f2];
      else out[id][f2] = { ts: e.ts, state: "open" };
    }
    if (!Object.keys(out[id]).length) delete out[id];
  }
  return out;
}
function mergePending() {
  var out = {};
  for (var k in COM) out[k] = COM[k].slice();
  for (var id in PEND) {
    out[id] = (out[id] || []).concat(PEND[id].map(function (c) {
      return { ts: c.ts, text: c.text, state: "open" };
    }));
  }
  return out;
}
function buildDoc(comments, edits, flags) {
  var b64 = document.getElementById("tpl").textContent.trim();
  var tpl = decodeURIComponent(escape(atob(b64)));
  var data = JSON.stringify({ meta: META, rows: ROWS, comments: comments, edits: edits, flags: flags })
    .replace(/</g, "\\u003c");
  /* markers are assembled at runtime so this source does not itself contain
     them - the builder replaces every literal occurrence in the template. */
  var mT = "__TPL" + "_B64__", mD = "__DATA" + "_JSON__";
  var inner = tpl.replace(mT, function () { return b64; })
                 .replace(mD, function () { return data; });
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1"></head><body>' +
    inner + "</body></html>";
}
function doSave() {
  var btn = document.getElementById("bsave");
  if (!ART) { toast("Saving is not available in this view. Use Copy open comments instead."); return; }
  btn.disabled = true; btn.textContent = "Saving…";
  var merged = mergePending(), mergedE = mergeEdits(), mergedF = mergeFlags();
  var doc;
  try { doc = buildDoc(merged, mergedE, mergedF); }
  catch (e) { btn.disabled = false; btn.textContent = "Save to the page"; toast("Could not build the new version: " + e.message); return; }
  try { sessionStorage.setItem(VIEW_KEY, JSON.stringify({ y: window.scrollY })); } catch (e) {}
  ART.publish(doc).then(function () {
    PEND = {}; savePend(); PEDIT = {}; saveEdits(); PFLAG = {}; saveFlags();
    toast("Saved. Reloading to the new version…");
  }).catch(function (err) {
    var code = (err && err.code) || "upstream_error";
    btn.disabled = false; btn.textContent = "Save to the page";
    if (code === "conflict") { toast("Someone else published first. Your comments are kept here; the page is reloading."); return; }
    if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
        code === "capability_disabled" || code === "capability_removed" || code === "consent_required") {
      READONLY = true; showWarn("This view can read the board but not save to it. Your comments stay in this browser — use <b>Copy open comments</b> to get them out.");
      updateBar(); return;
    }
    if (code === "too_large") { toast("The page is too large to save. Ask Claude to rebuild it."); return; }
    if (code === "rate_limited") { toast("Saving too often. Wait a moment and try again."); return; }
    toast("Save failed (" + code + "). Your comments are still here — use Copy open comments.");
  });
}
function showWarn(html) {
  var w = document.getElementById("warn");
  if (w) w.innerHTML = '<div class="warnbar">' + html + "</div>";
}

/* ---------------------------- boot ---------------------------- */
render();
wireFilters();
updateBar();
apply();

function openInput(el, id, f, cur, kind) {
  var inp = document.createElement("input");
  inp.type = kind === "date" ? "date" : "text";
  inp.className = "efinp";
  inp.value = cur || "";
  if (kind === "text") inp.placeholder = "$0,000";
  var prev = el.innerHTML;
  el.innerHTML = ""; el.appendChild(inp); inp.focus();
  var done = false;
  function close(commit) {
    if (done) return; done = true;
    var v = (inp.value || "").trim();
    if (kind === "text" && v && v.charAt(0) !== "$") v = "$" + v;
    el.innerHTML = prev;
    if (commit && v !== cur) setEdit(id, f, v); else updateBar();
  }
  inp.addEventListener("change", function () { close(true); });
  inp.addEventListener("blur", function () { close(true); });
  inp.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); close(true); }
    if (ev.key === "Escape") { ev.stopPropagation(); done = true; el.innerHTML = prev; updateBar(); }
  });
  inp.addEventListener("click", function (ev) { ev.stopPropagation(); });
}
function openPicker(el) {
  if (el.querySelector("select") || el.querySelector("input")) return;
  var id = el.dataset.ef, f = el.dataset.f, r = rowById(id);
  var cur = shown(r, f);
  var kind = FIELD_TYPE[f];
  if (kind) { openInput(el, id, f, cur, kind); return; }
  var list = (META.opts && META.opts[f]) || [];
  var sel = document.createElement("select");
  sel.className = "efsel";
  var vals = list.slice();
  if (cur && vals.indexOf(cur) < 0) vals.unshift(cur);
  if (f === "community" || f === "owner_short") vals.unshift("");
  vals.forEach(function (v) {
    var o = document.createElement("option");
    o.value = v; o.textContent = v || "(blank)";
    if (v === cur) o.selected = true;
    sel.appendChild(o);
  });
  var prev = el.innerHTML;
  el.innerHTML = ""; el.appendChild(sel); sel.focus();
  var done = false;
  function close(commit) {
    if (done) return; done = true;
    var v = sel.value;
    el.innerHTML = prev;
    if (commit && v !== cur) setEdit(id, f, v); else updateBar();
  }
  sel.addEventListener("change", function () { close(true); });
  sel.addEventListener("blur", function () { close(false); });
  sel.addEventListener("keydown", function (ev2) {
    if (ev2.key === "Escape") { ev2.stopPropagation(); close(false); }
  });
  sel.addEventListener("click", function (ev2) { ev2.stopPropagation(); });
}
document.addEventListener("change", function (ev) {
  var cb = ev.target.closest("input[data-fl]");
  if (cb) setFlag(cb.dataset.fl, cb.dataset.k, cb.checked);
});
document.addEventListener("click", function (ev) {
  if (ev.target.closest(".fl")) { ev.stopPropagation(); return; }
  var ef = ev.target.closest(".ef");
  if (ef && !ev.target.closest("#mask")) { ev.stopPropagation(); openPicker(ef); return; }
  var cb = ev.target.closest(".cbtn");
  if (cb) { ev.stopPropagation(); openModal(cb.dataset.c); return; }
  var id = ev.target.closest(".rid");
  if (id && !ev.target.closest(".mhead")) { copy(id.textContent.trim()); flash(id, "copied"); return; }
  if (id) { copy(id.textContent.trim()); return; }
  var cq = ev.target.closest(".cpq");
  if (cq) { copy(cq.dataset.q); flash(cq, "copied"); }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") { if (document.getElementById("mask")) closeModal(); }
});
window.addEventListener("beforeunload", function (ev) {
  if (pendCount()) { ev.preventDefault(); ev.returnValue = ""; }
});
try {
  var v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null");
  if (v && typeof v.y === "number") { window.scrollTo(0, v.y); sessionStorage.removeItem(VIEW_KEY); }
} catch (e) {}

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(function (a) {
    ART = a || null;
    if (!ART) { READONLY = true; showWarn("Saving is not available in this view, so comments stay in this browser only. <b>Copy open comments</b> still works."); }
    updateBar();
  }).catch(function () { READONLY = true; updateBar(); });
} else {
  READONLY = true;
  showWarn("This copy of the board is running outside claude.ai, so it cannot save. Comments stay in this browser.");
}

</script>
