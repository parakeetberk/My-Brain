<h1>Operational Procedure: Move-Out Process</h1>
<div class="sub">Parakeet Communities · Operations SOP — Swim-Lane Flowchart</div>
<div class="meta">Resident-Owned Home — Non-Eviction &nbsp;|&nbsp; Process Owner: Natalie Magurne, Director of Operations</div>
<svg viewBox="0 0 1060 1320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/></marker>
  <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/></marker>
  <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C62828" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>

<!-- LANE HEADERS -->
<rect x="22"  y="14" width="230" height="30" fill="#854F0B"/><text font-family="Arial" font-size="11" font-weight="600" fill="white" text-anchor="middle" x="137" y="33">Resident (Seller)</text>
<rect x="256" y="14" width="230" height="30" fill="#1F3864"/><text font-family="Arial" font-size="11" font-weight="600" fill="white" text-anchor="middle" x="371" y="33">On-Site Manager</text>
<rect x="490" y="14" width="230" height="30" fill="#0F6E56"/><text font-family="Arial" font-size="11" font-weight="600" fill="white" text-anchor="middle" x="605" y="33">Regional Manager</text>
<rect x="724" y="14" width="314" height="30" fill="#1B4F72"/><text font-family="Arial" font-size="11" font-weight="600" fill="white" text-anchor="middle" x="881" y="33">Home Office / Asset Management</text>

<!-- LANE BACKGROUNDS -->
<rect x="22"  y="44" width="230" height="1260" fill="#854F0B" opacity="0.04"/>
<rect x="256" y="44" width="230" height="1260" fill="#1F3864" opacity="0.04"/>
<rect x="490" y="44" width="230" height="1260" fill="#0F6E56" opacity="0.04"/>
<rect x="724" y="44" width="314" height="1260" fill="#1B4F72" opacity="0.04"/>

<!-- LANE DIVIDERS -->
<line x1="252"  y1="14" x2="252"  y2="1304" stroke="#ccc" stroke-width="0.5" stroke-dasharray="5 4"/>
<line x1="486"  y1="14" x2="486"  y2="1304" stroke="#ccc" stroke-width="0.5" stroke-dasharray="5 4"/>
<line x1="720"  y1="14" x2="720"  y2="1304" stroke="#ccc" stroke-width="0.5" stroke-dasharray="5 4"/>

<!-- STEP 1: Resident submits notice -->
<rect x="30" y="60" width="214" height="52" rx="6" fill="#fde9b8" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="Arial" font-size="11" font-weight="600" fill="#633806" text-anchor="middle" x="137" y="80">Submit 30-Day Notice</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="137" y="94">In writing — verbal not accepted</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="137" y="106">Triggers the move-out process</text>

<!-- STEP 2: Manager receives + forwards -->
<rect x="264" y="60" width="214" height="52" rx="6" fill="#d0e4f8" stroke="#1F3864" stroke-width="0.5"/>
<text font-family="Arial" font-size="11" font-weight="600" fill="#0C2754" text-anchor="middle" x="371" y="80">Receive &amp; Forward Notice</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="94">Receive written notice</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="106">Forward to Home Office promptly</text>
<line x1="244" y1="86" x2="262" y2="86" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- STEP 3: Home Office updates RM -->
<rect x="732" y="60" width="298" height="68" rx="6" fill="#cce0f5" stroke="#1B4F72" stroke-width="0.5"/>
<text font-family="Arial" font-size="11" font-weight="600" fill="#0B3054" text-anchor="middle" x="881" y="80">Update Rent Manager</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="881" y="96">Enter move-out date in RM</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="881" y="110">Send move-out report to Regional</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="881" y="122">Manager + Community Manager</text>
<line x1="478" y1="86" x2="730" y2="86" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

<!-- STEP 4: Exterior inspection -->
<rect x="264" y="150" width="214" height="52" rx="6" fill="#d0e4f8" stroke="#1F3864" stroke-width="0.5"/>
<text font-family="Arial" font-size="11" font-weight="600" fill="#0C2754" text-anchor="middle" x="371" y="170">Exterior Move-Out Inspection</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="184">Inspect lot · Document findings</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="196">Submit to Regional Manager</text>
<line x1="371" y1="112" x2="371" y2="148" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- STEP 5: Regional approves? -->
<polygon points="605,226 675,254 605,282 535,254" fill="#eee" stroke="#aaa" stroke-width="0.5"/>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="605" y="250">Approve lot</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="605" y="264">condition &amp; account?</text>
<line x1="371" y1="202" x2="371" y2="244" stroke="#888" stroke-width="1"/>
<line x1="371" y1="244" x2="533" y2="244" stroke="#888" stroke-width="1"/>
<line x1="533" y1="244" x2="533" y2="254" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- NO: Manager notifies resident of issues -->
<text font-family="Arial" font-size="10" fill="#C62828" x="398" y="268">NO</text>
<line x1="535" y1="254" x2="371" y2="254" stroke="#C62828" stroke-width="1"/>
<line x1="371" y1="254" x2="371" y2="296" stroke="#C62828" stroke-width="1" marker-end="url(#arr-r)"/>
<rect x="264" y="296" width="214" height="40" rx="4" fill="#fce8e8" stroke="#C62828" stroke-width="0.5"/>
<text font-family="Arial" font-size="10" fill="#791F1F" text-anchor="middle" x="371" y="314">Notify resident of issues</text>
<text font-family="Arial" font-size="10" fill="#791F1F" text-anchor="middle" x="371" y="328">Resident corrects · Re-inspect</text>

<!-- Resident corrects -->
<rect x="30" y="296" width="214" height="40" rx="4" fill="#fce8e8" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="Arial" font-size="10" fill="#633806" text-anchor="middle" x="137" y="314">Resident Corrects Issues</text>
<text font-family="Arial" font-size="10" fill="#633806" text-anchor="middle" x="137" y="328">Then re-submit for inspection</text>
<line x1="264" y1="316" x2="244" y2="316" stroke="#C62828" stroke-width="1" marker-end="url(#arr-r)"/>
<line x1="137" y1="296" x2="137" y2="264" stroke="#854F0B" stroke-width="1"/>
<line x1="137" y1="264" x2="371" y2="264" stroke="#854F0B" stroke-width="1"/>
<line x1="371" y1="264" x2="371" y2="254" stroke="#854F0B" stroke-width="1" marker-end="url(#arr)"/>

<!-- YES: Notify approval -->
<text font-family="Arial" font-size="10" fill="#2E7D32" x="678" y="262">YES</text>
<line x1="675" y1="254" x2="730" y2="254" stroke="#2E7D32" stroke-width="1" marker-end="url(#arr-g)"/>

<!-- Regional approves - sends to manager -->
<rect x="498" y="346" width="214" height="40" rx="6" fill="#c8ede0" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="Arial" font-size="10" font-weight="600" fill="#085041" text-anchor="middle" x="605" y="364">Approve &amp; Notify Manager</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="605" y="378">Lot + account cleared for sale</text>
<line x1="605" y1="282" x2="605" y2="344" stroke="#2E7D32" stroke-width="1" marker-end="url(#arr-g)"/>
<line x1="486" y1="366" x2="480" y2="366" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- STEP 6: Manager notifies resident approved -->
<rect x="264" y="404" width="214" height="68" rx="6" fill="#d0e4f8" stroke="#1F3864" stroke-width="0.5"/>
<text font-family="Arial" font-size="11" font-weight="600" fill="#0C2754" text-anchor="middle" x="371" y="424">Notify Resident of Approval</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="440">Lot is approved to sell</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="454">Explain future buyer process:</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="466">Buyer must apply + be approved</text>
<line x1="371" y1="386" x2="371" y2="402" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- KEY WARNING BOX -->
<rect x="22" y="492" width="1016" height="64" rx="4" fill="#FFF9C4" stroke="#C62828" stroke-width="0.75"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#C62828" text-anchor="middle" x="530" y="512">⚠ KEY RULE — RESIDENT LIABILITY</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="530" y="528">The current resident remains liable for ALL lot rent and charges until the prospective buyer applies for residency AND is approved by Parakeet Communities.</text>
<text font-family="Arial" font-size="10" fill="#C62828" font-weight="600" text-anchor="middle" x="530" y="546">This applies even if: the sale is executed · the home is vacated · the buyer has moved in · the 30-day notice has elapsed.</text>
<line x1="371" y1="472" x2="371" y2="490" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- Buyer applies + gets approved -->
<rect x="30" y="576" width="214" height="52" rx="6" fill="#fde9b8" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="Arial" font-size="11" font-weight="600" fill="#633806" text-anchor="middle" x="137" y="596">Buyer Applies for Residency</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="137" y="610">Submits formal application</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="137" y="622">Current resident still liable at this point</text>
<line x1="137" y1="556" x2="137" y2="574" stroke="#888" stroke-width="1"/>
<line x1="137" y1="556" x2="371" y2="556" stroke="#888" stroke-width="1"/>
<line x1="371" y1="556" x2="371" y2="556" stroke="#888" stroke-width="0.5"/>

<!-- Application reviewed -->
<rect x="264" y="576" width="214" height="52" rx="6" fill="#d0e4f8" stroke="#1F3864" stroke-width="0.5"/>
<text font-family="Arial" font-size="11" font-weight="600" fill="#0C2754" text-anchor="middle" x="371" y="596">Application Reviewed</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="610">Standard application process</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="371" y="622">Regional + community approval</text>
<line x1="244" y1="602" x2="262" y2="602" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- Home Office transitions in RM -->
<rect x="732" y="576" width="298" height="68" rx="6" fill="#cce0f5" stroke="#1B4F72" stroke-width="0.5"/>
<text font-family="Arial" font-size="11" font-weight="600" fill="#0B3054" text-anchor="middle" x="881" y="596">Transition in Rent Manager</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="881" y="612">Move current resident OUT</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="881" y="626">Move new resident IN</text>
<text font-family="Arial" font-size="10" fill="#333" text-anchor="middle" x="881" y="640">Update status + recurring charges</text>
<line x1="478" y1="602" x2="730" y2="602" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

<!-- END -->
<rect x="390" y="682" width="280" height="34" rx="17" fill="#2E7D32"/>
<text font-family="Arial" font-size="12" font-weight="600" fill="white" text-anchor="middle" x="530" y="704">MOVE-OUT COMPLETE</text>
<text font-family="Arial" font-size="10" fill="#555" text-anchor="middle" x="530" y="728">Resident removed · New resident onboarded</text>
<line x1="881" y1="644" x2="881" y2="700" stroke="#2E7D32" stroke-width="1"/>
<line x1="881" y1="700" x2="672" y2="700" stroke="#2E7D32" stroke-width="1" marker-end="url(#arr-g)"/>

<!-- Footer -->
<line x1="22" y1="760" x2="1038" y2="760" stroke="#2E7D32" stroke-width="1"/>
<text font-family="Arial" font-size="10" fill="#1F3864" font-style="italic" text-anchor="middle" x="530" y="778">Parakeet Communities, LLC · Confidential Internal Document · Not for External Distribution</text>
<text font-family="Arial" font-size="10" fill="#1F3864" font-style="italic" text-anchor="middle" x="530" y="792">Process Owner: Natalie Magurne, Director of Operations · Status: DRAFT — Pending Approval</text>
